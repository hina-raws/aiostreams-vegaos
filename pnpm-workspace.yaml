packages:
  - packages/*
  # The Vega app is a React Native project with its own npm install, like
  # packages/android and packages/desktop, and stays outside the workspace.
  - '!packages/vega'

allowBuilds:
  '@webos-tools/cli': false
  bcrypt: true
  better-sqlite3: true
  core-js: true
  cpu-features: false
  esbuild: true
  lfa-ponyfill: false
  sharp: true
  sqlite3: true
  ssh2: false
  unrs-resolver: true
  yencode: true

patchedDependencies:
  '@radix-ui/react-select@2.4.1': patches/@radix-ui__react-select@2.4.1.patch
  stremthru: patches/stremthru.patch
  yencode@1.2.4: patches/yencode@1.2.4.patch
